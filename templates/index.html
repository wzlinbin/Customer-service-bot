<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>在线客服示例</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="mx-auto flex min-h-screen max-w-5xl items-center px-6 py-16">
        <section>
            <p class="mb-3 text-sm font-semibold text-blue-600">客服系统演示</p>
            <h1 class="text-4xl font-bold sm:text-5xl">需要帮助？</h1>
            <p class="mt-5 max-w-xl text-base leading-7 text-gray-600">
                点击右下角的在线客服按钮开始对话，客服回复会实时显示在聊天窗口中。
            </p>
        </section>
    </main>

    <script src="/static/chat-widget.js" defer></script>
</body>
</html>
